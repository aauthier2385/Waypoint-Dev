name: Release
# Builds the ISO and publishes it as a GitHub release that anyone can download.
# Start it from Actions > Release > Run workflow, and give it a version like 1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, like 1.0.0"
        required: true
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils nodejs apt-utils
      - run: pip install pytest pygame
      - run: pytest -q

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Check the version number
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Use a version like 1.0.0"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "::error::v$VERSION already exists"; exit 1; fi
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /
      - run: ./build.sh
      - name: Name the ISO and check its size
        env:
          VERSION: ${{ inputs.version }}
        run: |
          iso="dist/waypoint-dev-$VERSION-amd64.iso"
          mv dist/waypoint-1-amd64.iso "$iso"
          size=$(stat -c %s "$iso")
          echo "ISO size: $((size / 1024 / 1024)) MiB"
          # GitHub only accepts release files under 2 GiB.
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::The ISO is $((size / 1024 / 1024)) MiB. GitHub releases need files under 2048 MiB."
            exit 1
          fi
          (cd dist && sha256sum "$(basename "$iso")" > SHA256SUMS)
          echo "ISO=$iso" >> "$GITHUB_ENV"
          echo "SHA=$(cut -d' ' -f1 dist/SHA256SUMS)" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA/g" docs/release-notes.md > notes.md
          gh release create "v$VERSION" "$ISO" dist/SHA256SUMS \
            --title "Waypoint Dev $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
