name: Publish updates
# Runs only after CI passes on main, then publishes the signed apt repository.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish-updates
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - name: Load the signing key
        env:
          WAYPOINT_APT_KEY: ${{ secrets.WAYPOINT_APT_KEY }}
        run: |
          test -n "$WAYPOINT_APT_KEY" || { echo "::error::Add the WAYPOINT_APT_KEY repository secret first."; exit 1; }
          printf '%s\n' "$WAYPOINT_APT_KEY" | gpg --batch --import
          key_id="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          echo "KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --armor --export "$key_id" > "$RUNNER_TEMP/waypoint.asc"
      - name: Build the package and repository
        run: |
          ./scripts/build-deb.sh "1.0.${GITHUB_RUN_NUMBER}" "$RUNNER_TEMP/waypoint.asc" "$RUNNER_TEMP/deb"
          ./scripts/build-apt-repo.sh "$RUNNER_TEMP"/deb/*.deb "$KEY_ID" "$RUNNER_TEMP/waypoint.asc" "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v4
