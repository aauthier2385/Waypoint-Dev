name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils nodejs
      - run: pip install pytest pygame
      - run: pytest -q
